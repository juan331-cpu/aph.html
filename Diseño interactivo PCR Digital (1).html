<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.inp{width:100%;min-height:48px;padding:10px 12px;border:2px solid #cbd5e1;border-radius:12px;font-size:16px;background:#fff;color:#0f172a}
.dark .inp,.dark .pill{background:#1e293b;border-color:#475569;color:#f1f5f9}
.pill{min-height:48px;padding:8px 14px;border:2px solid #cbd5e1;border-radius:999px;font-weight:600;background:#fff;color:#0f172a}
.pill.sm{min-height:40px;padding:6px 10px;font-size:14px}
.pill.xs{min-height:32px;padding:2px 4px;font-size:12px;width:100%}
.tinp{width:100%;min-height:40px;padding:4px 2px;border:2px solid #cbd5e1;border-radius:8px;font-size:14px;text-align:center;background:#fff;color:#0f172a}
.dark .tinp{background:#1e293b;border-color:#475569;color:#f1f5f9}
#tbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#f1f5f9;padding-top:4px;padding-bottom:10px;margin-bottom:16px;border-bottom:2px solid #94a3b8;box-shadow:0 5px 6px -5px rgba(0,0,0,.3)}
.dark #tbar{background:#0f172a;border-bottom-color:#64748b}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:#f1f5f9}
.dark body::before{background:#0f172a}
.pill.on{background:#dc2626;border-color:#dc2626;color:#fff}
.pill.on.tII{background:#eab308;border-color:#eab308;color:#000}
.pill.on.tIII{background:#16a34a;border-color:#16a34a}
.pill.on.tIV{background:#111827;border-color:#111827}
.l{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
#sheet{display:none;background:#fff;color:#000}#sheet.on{display:block}
.st{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:4px}
.st td{border:1px solid #000;padding:3px 5px;vertical-align:top}
.sh{background:#e5e7eb;border:1px solid #000;font-weight:700;font-size:11px;padding:2px 5px;margin-top:6px}
.gh{font-weight:700;font-size:12px;text-align:center;padding:8px 2px;color:#111;border:2px solid #444;border-radius:6px 6px 0 0}.gb{display:flex;justify-content:space-between;align-items:center;gap:2px;width:100%;min-height:48px;padding:4px 6px;font-size:12px;color:#111;border:1px solid #888;margin-top:2px;text-align:left;line-height:1.1}.gb.on{background:#111!important;color:#fff;border-color:#111}.hO{background:#f0a58f}.bO{background:#f8d9c8}.hV{background:#9a9a9a}.bV{background:#cfcfcf}.hM{background:#f08f9c}.bM{background:#f6cdd3}.gf{background:#4b4b4b;color:#fff;text-align:center;padding:8px;font-size:13px;margin-top:4px;border-radius:0 0 6px 6px}
#fabs{position:fixed;right:12px;bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:40}
.fab{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:#dc2626;color:#fff;font-size:20px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.35);opacity:.92}
#toast{display:none;position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;font-size:14px}
.pb{flex:1;min-width:0;min-height:46px;border-radius:10px;border:2px solid transparent;font-weight:700;font-size:15px;color:#111;padding:0}
.pb.on{color:#fff;border-color:#111;transform:scale(1.1);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.gs{font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#1e3a5f;margin:14px 0 6px}
.dark .gs{color:#93c5fd}
.go{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px;padding:6px 12px;border:2px solid #e2e8f0;border-radius:12px;background:#fff;color:#0f172a;font-size:14px;text-align:left;line-height:1.15}
.go b{font-size:16px;color:#64748b}
.go.on{background:#1e3a5f;border-color:#1e3a5f;color:#fff}.go.on b{color:#fff}
.dark .go{background:#1e293b;border-color:#475569;color:#f1f5f9}
.dark .go.on{background:#2563eb;border-color:#2563eb}
.gt{background:#1e3a5f;color:#fff;font-weight:700;font-size:12px;text-align:center;padding:8px 2px;border-radius:10px;line-height:1.15}
.dark .gt{background:#334155}
.go.sm{font-size:12px;padding:4px 6px;min-height:52px;gap:4px;border-radius:10px;word-break:break-word}
.go.sm b{font-size:15px}
.gres{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border:2px solid #cbd5e1;border-radius:16px;background:#fff;color:#0f172a}
.dark .gres{background:#1e293b;border-color:#475569;color:#f1f5f9}
.gres.done{background:#fff;border-color:#1e3a5f;color:#1e3a5f}
.dark .gres.done{background:#fff;border-color:#1e3a5f;color:#1e3a5f}
.gres .n{font-size:44px;font-weight:800;line-height:1}
.gres .n small{font-size:14px;font-weight:600}
.gres small{font-size:12px;opacity:.8}
#app,#fabs{zoom:.7}
@media print{.noprint,#app,#toast{display:none!important}@page{size:A4;margin:10mm}}
</style></head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-900 dark:text-slate-100">
<div id="app" class="max-w-xl mx-auto px-4 pt-3 pb-32">
<header class="flex items-center justify-between gap-2 mb-3"><h1 class="font-extrabold text-lg">🚑 Registro de Atención al Paciente</h1>
<div class="flex gap-2"><button class="pill sm" data-act="theme">🌙</button><button class="pill sm" data-act="fill">Prueba</button><button class="pill sm" data-act="new">Nuevo</button></div></header>
<main id="main"></main>
<nav class="fixed bottom-0 inset-x-0 bg-white dark:bg-slate-800 border-t border-slate-300 dark:border-slate-600" style="padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))"><div id="nav" class="max-w-xl mx-auto flex gap-2"></div></nav>
</div>
<div id="fabs" class="noprint"><button class="fab" data-act="up" aria-label="Ir al inicio">▲</button><button class="fab" data-act="down" aria-label="Ir al final">▼</button></div>
<div id="sheet"></div><div id="toast"></div><input type="file" id="ph" accept="image/*" capture="environment" hidden>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LT={'Contusión':['C','#7c3aed'],'Abrasión':['A','#b45309'],'Laceración':['L','#0891b2'],'H. Penetrante':['HP','#dc2626'],'Picadura/Mordedura':['PM','#16a34a'],'H. Avulsiva':['AV','#ea580c'],Empalamiento:['E','#be185d'],Fractura:['F','#1d4ed8'],Esguince:['ES','#0d9488'],'Luxación':['LX','#a16207'],Trauma:['T','#475569']};
const S=[
{t:'Identificación del servicio',f:[['ips','IPS que realiza el traslado'],['sem','SEM','half'],['placa','Placa de la ambulancia','half'],['sep1','','hr'],['hSalida','Hora de salida','tm'],['hEscena','Hora de llegada a la escena','tm'],['hTraslado','Hora de inicio de traslado','tm'],['hIPS','Hora de llegada a la IPS','tm'],['hFin','Hora de fin del evento','tm'],['direccion','Dirección del evento','addr'],['comuna','Comuna','com',[...Array(17)].map((_,i)=>''+(i+1)).concat('No aplica')],['barrio','Barrio'],['sepB','','hr'],['hEvento','Hora del evento','time']]},
{t:'Paciente y Evento',get f(){const at=D.tev=='A.T',eg=D.tev=='E.G';return nnf([['nn','','nn'],['nombre','Nombre completo'],['tdoc','Tipo','tipo',[['CE','Cédula de extranjería'],['CC','Cédula de ciudadanía'],['TI','Tarjeta de identidad'],['RN','Registro de nacimiento'],['PPT','Permiso por protección temporal (PPT)'],['OTRO','Otro']]],['doc','Documento','docr'],['fnac','Fecha de nacimiento','date'],['edad','Edad','half'],['genero','Sexo','gen',['Masculino','Femenino']],['sepS','','hr'],['tsangre','Tipo de sangre','selh',BL],['ecivil','Estado civil','selh',['Soltero(a)','Casado(a)','Unión libre','Separado(a)','Divorciado(a)','Viudo(a)']],['eps','EPS'],['ocup','Ocupación'],['dirViv','Dirección de vivienda'],...(ac(D.tdoc)?[['sep2','','hr'],['aParent','Parentesco'],['aNombre','Nombre completo (acudiente)'],['atdoc','Tipo doc. acudiente','tipoa',[['CC','Cédula de ciudadanía'],['CE','Cédula de extranjería'],['PPT','Permiso por protección temporal (PPT)'],['OTRO','Otro']]],['adoc','Documento acudiente','docr']]:[]),['tel','Teléfono','tel'],['emerg','Contacto de emergencia','half'],['sep','','hr'],['victimas','N° de víctimas','number'],['tev','Tipo de evento','p',['A.T','E.G']],...(at?[['tipoVeh','Tipo de vehículo','p',['Automóvil','Moto','Bicicleta','Camión','Bus','Otro']],['aseg','Aseguramiento','p',['SOAT','ADRES','Ninguno']],['aseguradora','Aseguradora'],['poliza','N° de póliza'],['polizaPlaca','Placa de la póliza']]:[]),...(eg?[['aseg','Aseguramiento','p',['EPS','ADRES']]]:[]),['hechos','Versión de los hechos','ta']])}},
{t:'Signos vitales y estado',f:[['fc','FC (lpm)','number'],['sat','SatO₂ (%)','number'],['pas','PAS (mmHg)','number'],['pad','PAD (mmHg)','number'],['fr','FR (rpm)','number'],['temp','Temp (°C)','number'],['gl','Escala de Glasgow','gcs'],['neuro','','m',['Aparente estado de alicoramiento']],['sepN','','hr'],['triage','Triage','triage'],['isub','','sub'],['antec','Antecedentes patológicos','niega'],['medic','Medicamentos','niega'],['alerg','Alergias','niega'],['otroC','Otro','txt']]},
{t:'Mapa corporal de lesiones',map:1},
{t:'Traslado y Personal encargado',get f(){const ca=D.acomp=='Sí',ot=D.acTipo=='Otro';return [['ipsTras','IPS de traslado'],['acomp','Con acompañante','tog'],...(ca?[['acTipo','Acompañante','acsel']]:[]),...(ca&&D.acTipo=='Mismo por menor de edad'?[['acinfo','','acinfo']]:[]),...(ca&&ot?[['cParent','Parentesco (acompañante)'],['cNombre','Nombre completo (acompañante)'],['ctdoc','Tipo doc. acompañante','tipoc',[['CC','Cédula de ciudadanía'],['CE','Cédula de extranjería'],['PPT','Permiso por protección temporal (PPT)'],['OTRO','Otro']]],['cdoc','Documento acompañante','docr'],['cTel','Teléfono (acompañante)','tel']]:[]),['sepA','','hr'],['aux','Auxiliar / Paramédico'],['cond','Conductor'],['sepC','','hr'],['adm','Persona encargada que recibe al paciente']]}}];
[S[2],S[3]]=[S[3],S[2]];
let D={},M=[],P=[],step=0,mt='Contusión',armed=0,SCOK=null,SCMSG='',scanning=0;
const g=k=>esc(k=='tev'&&TEV[D[k]]?TEV[D[k]]:(k=='tdoc'||k=='atdoc')&&D[k]=='OTRO'&&D[k+'O']?D[k+'O']:D[k]);
const GCS=[['O','Apertura ocular',[[4,'Espontánea'],[3,'A estímulo verbal'],[2,'A estímulo doloroso'],[1,'Ninguna']]],['V','Respuesta verbal',[[5,'Orientado'],[4,'Confuso'],[3,'Inapropiado'],[2,'Incomprensible'],[1,'Ninguna']]],['M','Respuesta motora',[[6,'Obedece'],[5,'Localiza el dolor'],[4,'Retirada al dolor'],[3,'Flexión anormal'],[2,'Extensión anormal'],[1,'Ninguna']]]];
const glx=()=>{const nm=c=>{const o=GCS.find(x=>x[0]==c)[2].find(p=>p[0]==D['g'+c]);return o?c+o[0]+' '+o[1]:''},t=['O','V','M'].map(nm).filter(Boolean).join(' · '),tot=D.gl?D.gl.split(' ')[0]:'';const nc=D.neuro?5:4;return '<table class="st" style="table-layout:fixed"><colgroup><col style="width:14%"><col><col><col>'+(D.neuro?'<col style="width:24%">':'')+'</colgroup><tr><td colspan="'+nc+'" style="font-weight:700;vertical-align:middle">Escala de coma de Glasgow</td></tr><tr><td style="text-align:center;vertical-align:middle"><b style="font-size:14px">'+(tot||'&nbsp;&nbsp;')+'</b>/15</td>'+['O','V','M'].map(c=>'<td style="vertical-align:middle">'+esc(nm(c))+'&nbsp;</td>').join('')+(D.neuro?'<td style="vertical-align:middle"><b>'+esc(D.neuro)+'</b></td>':'')+'</tr></table>'};
const trx=()=>'<table class="st" style="table-layout:fixed"><tr><td style="width:22%;font-weight:700;vertical-align:middle">Triage</td><td style="vertical-align:middle"><b style="font-size:14px">'+(g('triage')||'&nbsp;')+'</b></td></tr></table>';
const gl=()=>{const a=['O','V','M'].map(c=>+D['g'+c]||0);D.gl=a.every(Boolean)?(a[0]+a[1]+a[2])+' (O'+a[0]+'·V'+a[1]+'·M'+a[2]+')':''};
const age=s=>{const b=new Date(s+'T00:00:00'),n=new Date();if(isNaN(b)||b>n)return '';let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;if(a>=1)return a+(a==1?' año':' años');let m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;return m>=1?m+(m==1?' mes':' meses'):Math.floor((n-b)/864e5)+' días'};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',2600)}
const TS={CC:'CC',CE:'CE',TI:'TI',RN:'RN',PPT:'PPT',OTRO:'Otro'},TEV={'A.T':'Accidente de Tránsito','E.G':'Enfermedad General'},BL=['A+','A-','B+','B-','AB+','AB-','O+','O-','Desconocido'];
const ac=v=>v=='TI'||v=='RN';
const evs=()=>{const a=[['Antecedentes patológicos','antec'],['Medicamentos','medic'],['Alergias','alerg']].map(([l,k])=>{const v=D[k+'N']?'Niega':D[k];return v?l+': '+v:''}),p=[...a,D.otroC?'Otro: '+D.otroC:''].filter(Boolean);return p.length?'🩺 Evaluación secundaria – '+p.join('; ')+'\n':''};
const HID=['nombre','nac','tdoc','doc','fnac','edad','tsangre','ecivil','eps','ocup','dirViv','sep2','aParent','aNombre','atdoc','adoc','tel','emerg'];
const nnf=L=>D.nn?L.filter(f=>!HID.includes(f[0])).flatMap(f=>f[0]=='nn'?[f,['nnNombre','Nombre completo','nnv']]:f[0]=='genero'?[f,['edadAprox','Edad aproximada','half']]:[f]):L;
const nom=()=>D.nn?'N.N':D.nombre,eda=()=>D.nn?(D.edadAprox?D.edadAprox+' (aprox.)':''):D.edad;
const CI=()=>[['Parentesco',D.aParent],['Nombre completo',D.aNombre],['Tipo doc.',D.atdoc=='OTRO'&&D.atdocO?D.atdocO:TS[D.atdoc]||D.atdoc||''],['Documento',D.adoc],['Teléfono',D.tel]];
const cmp=()=>{if(D.acomp!='Sí'||!D.acTipo)return '';const m=D.acTipo!='Otro',p=m?[D.aParent,D.aNombre,[D.atdoc=='OTRO'&&D.atdocO?D.atdocO:TS[D.atdoc]||D.atdoc,D.adoc].filter(Boolean).join(' '),D.tel]:[D.cParent,D.cNombre,[TS[D.ctdoc]||D.ctdoc,D.cdoc].filter(Boolean).join(' '),D.cTel];return '👥 Acompañante ('+(m?'mismo por menor de edad':'otro')+'): '+(p.filter(Boolean).join(' · ')||'sin datos')+'\n'};
function field([k,l,t,o]){const v=D[k]||'';
if(t=='nnv')return '';
if(t=='com'){const b=x=>`<button type="button" class="pill sm ${v==x?'on':''}" style="padding:0;${x=='No aplica'?'grid-column:span 3':''}" data-k="${k}" data-v="${x}">${x}</button>`;return `<div class="col-span-2"><span class="l">${l}</span><div class="grid gap-1" style="grid-template-columns:repeat(10,1fr)">${o.map(x=>b(x)).join('')}</div></div>`}
if(t=='niega'){const n=D[k+'N'];return `<div class="col-span-2"><label class="l">${l}</label><div class="flex gap-2"><button type="button" class="pill ${n?'on':''}" style="white-space:nowrap" data-k="${k}N" data-v="1">Niega</button><input class="inp" value="${esc(v)}" data-k="${k}" ${n?'disabled style="opacity:.5"':''}></div></div>`}
if(t=='txt')return `<div class="col-span-2"><label class="l">${l}</label><input class="inp" value="${esc(v)}" data-k="${k}"></div>`;
if(t=='sub')return `<div class="col-span-2 mt-2"><div class="font-bold text-base border-b-2 border-slate-300 dark:border-slate-600 pb-1">Evaluación secundaria</div></div>`;
if(t=='triage'){const c={I:['#dc2626','#fff'],II:['#eab308','#000'],III:['#16a34a','#fff'],IV:['#111827','#fff']}[v];return `<div class="col-span-2"><span class="l">${l}</span><div class="flex gap-2">${['I','II','III','IV'].map(x=>`<button type="button" class="pill flex-1 ${v==x?'on t'+x:''}" data-k="${k}" data-v="${x}">${x}</button>`).join('')}</div></div>`}
if(t=='tog')return `<div class="col-span-2"><button type="button" class="pill ${D.acomp=='Sí'?'on':''}" style="width:100%" data-act="acomp">Con acompañante</button></div>`;
if(t=='acsel')return `<div class="col-span-2" style="margin-top:-6px;padding-left:14px"><div class="flex gap-2" style="border-left:3px solid #94a3b8;padding-left:10px"><button type="button" class="pill sm ${D.acTipo=='Mismo por menor de edad'?'on':''}" style="flex:2;min-height:34px;font-size:13px;padding:4px 8px" data-k="acTipo" data-v="Mismo por menor de edad">Mismo por menor de edad</button><button type="button" class="pill sm ${D.acTipo=='Otro'?'on':''}" style="flex:1;min-height:34px;font-size:13px;padding:4px 8px" data-k="acTipo" data-v="Otro">Otro</button></div></div>`;
if(t=='acinfo')return `<div class="col-span-2" style="margin-top:-6px;padding-left:14px"><div class="text-sm bg-white dark:bg-slate-800 rounded-xl p-3" style="border:2px solid #cbd5e1;margin-left:3px">${CI().map(([a,b])=>`<div class="flex justify-between gap-3 py-0.5"><span class="font-semibold">${a}</span><span class="text-right">${esc(b)||'—'}</span></div>`).join('')}<div class="text-xs mt-1" style="opacity:.65">Datos ingresados en la página 2</div></div></div>`;
if(t=='tipoc')return `<div class="col-span-2 flex gap-2"><div style="width:17%;flex:none"><span class="l">Tipo</span><div class="relative"><div id="tdvc" class="inp flex items-center justify-center text-center" style="padding:10px 2px">${TS[v]||'—'}</div><select class="absolute inset-0 w-full h-full opacity-0" data-k="${k}" aria-label="Tipo de documento del acompañante"><option value="">Selecciona…</option>${o.map(([c,n])=>`<option value="${c}" ${v==c?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="flex-1"><label class="l">Documento</label><input class="inp" value="${esc(D.cdoc)}" data-k="cdoc"></div></div>`;
if(t=='tipoa')return `<div class="col-span-2 flex gap-2"><div style="width:17%;flex:none"><span class="l">Tipo</span><div class="relative"><div id="tdva" class="inp flex items-center justify-center text-center" style="padding:10px 2px">${TS[v]||'—'}</div><select class="absolute inset-0 w-full h-full opacity-0" data-k="${k}" aria-label="Tipo de documento del acudiente"><option value="">Selecciona…</option>${o.map(([c,n])=>`<option value="${c}" ${v==c?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="flex-1"><label class="l">Documento</label><input class="inp" value="${esc(D.adoc)}" data-k="adoc"></div></div>${v=='OTRO'?`<div class="col-span-2"><input class="inp" placeholder="Escribe el tipo de documento" aria-label="Otro tipo de documento del acudiente" value="${esc(D.atdocO)}" data-k="atdocO"></div>`:''}`;
if(t=='tipo')return `<div class="col-span-2 flex gap-2"><div style="width:17%;flex:none"><span class="l">Tipo</span><div class="relative"><div id="tdv" class="inp flex items-center justify-center text-center" style="padding:10px 2px">${TS[v]||'—'}</div><select class="absolute inset-0 w-full h-full opacity-0" data-k="${k}" aria-label="Tipo de documento"><option value="">Selecciona…</option>${o.map(([c,n])=>`<option value="${c}" ${v==c?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="flex-1"><label class="l">Documento</label><input class="inp" value="${esc(D.doc)}" data-k="doc"></div></div>${v=='OTRO'?`<div class="col-span-2"><input class="inp" placeholder="Escribe el tipo de documento" aria-label="Otro tipo de documento" value="${esc(D.tdocO)}" data-k="tdocO"></div>`:''}`;
if(t=='gen')return `<div class="col-span-2"><span class="l">${l}</span><div class="flex flex-wrap gap-2">${o.map(x=>`<button type="button" class="pill ${v==x?'on':''}" data-k="${k}" data-v="${x}">${x}</button>`).join('')}</div></div>`;
if(t=='hr')return `<div class="col-span-2"><div class="border-t border-slate-300 dark:border-slate-600 my-1"></div></div>`;
if(t=='srow')return '';
